<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Mídias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Galeria de Mídias</h1>
    <p>Layout em CSS Grid com 3 colunas • Imagens, Vídeos e Áudios</p>
  </header>
  <main class="galeria">
    <figure class="item">
      <img src="img1.jpg" alt="Montanhas e lago ao entardecer">
      <figcaption>Montanhas e lago ao entardecer</figcaption>
    </figure>
    <figure class="item">
      <img src="img2.jpg" alt="Cachorro olhando para a câmera">
      <figcaption>Cachorro curioso — momento espontâneo</figcaption>
    </figure>
    <figure class="item">
      <video controls>
        <source src="video1.mp4" type="video/mp4">
        Seu navegador não suporta o elemento de vídeo.
      </video>
      <figcaption>Vídeo de demonstração (5 segundos)</figcaption>
    </figure>
    <figure class="item">
      <video controls>
        <source src="video2.mp4" type="video/mp4">
        Seu navegador não suporta o elemento de vídeo.
      </video>
      <figcaption>Vídeo de demonstração (10 segundos)</figcaption>
    </figure> 
    <figure class="item audio">
      <audio controls>
        <source src="audio1.mp3" type="audio/mpeg">
      </audio>
      <figcaption>Áudio de demonstração (3 segundos)</figcaption>
    </figure>
    <figure class="item audio">
      <audio controls>
        <source src="audio2.mp3" type="audio/mpeg">
      </audio>
      <figcaption>Áudio de demonstração (6 segundos)</figcaption>
    </figure>
  </main>
  <footer>
    <p>Atividade prática • CSS Grid • HTML5 • Tudo local e funcional</p>
  </footer>
</body>
</html>
