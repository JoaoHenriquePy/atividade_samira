<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Galeria de League of Legends</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>League of Legends</h1>
    <p>Melhor campeão do LOL</p>

    <main class="galeria">
        <figure>
            <img src="lol.webp" alt="">
            <figcaption>Titulo do jogo</figcaption>
        </figure>

        <figure>
            <img src="Brand_0.jpg" alt="">
            <figcaption>Campeão (Brand) do League of Legends</figcaption>
        </figure>

        <figure>
            <iframe width="392" height="697" src="https://www.youtube.com/embed/NUcKNB0uklg" title="Brand CURANDO mais que a TUA SORAKA! #leagueoflegends #lolbr" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <figcaption>Combinação de itens roubados para fazer o Brand como suporte</figcaption>
        </figure>

        <figure>
            <iframe width="392" height="697" src="https://www.youtube.com/embed/CDEikoifbxM" title="COMO STUNAR INSTA COM O BRAND #Short" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <figcaption>Mecanica de stun do personagem "Brand"</figcaption>
        </figure>

        <figure>
            <audio controls>
                <source src="shaco.mp3">
            </audio>

            <figcaption>Áudio do personagem Shaco no LOL</figcaption>
        </figure>

        <figure>
            <audio controls>
                <source src="missing.mp3">
            </audio>
            <figcaption>Famoso "ping" do LOL</figcaption>
        </figure>

    </main>
    <footer class="rodape">
        <p>&copy; 2026 Galeria do League of Legends. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
